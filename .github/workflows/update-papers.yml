name: Update arXiv Papers

on:
  schedule:
    # Twice a day, so one refused run does not leave the site stale.
    #
    # Deliberately not on the hour: GitHub queues scheduled workflows behind
    # everyone else's, and at '0 3' / '0 15' these runs were starting three
    # to five and a half hours late, which also dropped them into the
    # busiest window for arXiv's rate limiter.
    - cron: '23 5 * * *'
    - cron: '53 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let the two daily runs race each other onto main.
concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update-papers:
    runs-on: ubuntu-latest
    # The fetcher retries for up to 20 minutes per query against an arXiv
    # endpoint that refuses requests under load. This is the backstop for a
    # run that hangs rather than finishes.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      # Exits non-zero only when something is actually wrong: a corrupt data
      # file, or arXiv refusing for long enough that the site has gone stale.
      # A single refused run logs a warning and leaves _data alone.
      - name: Fetch papers
        run: python _scripts/fetch_papers.py

      - name: Commit and push if changed
        run: |
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add _data
          git diff --cached --quiet && { echo 'No changes.'; exit 0; }
          git commit -m 'Update arXiv papers'
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
