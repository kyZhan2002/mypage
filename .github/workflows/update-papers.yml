name: Update arXiv Papers

on:
  schedule:
    # Twice a day: arXiv rate-limits GitHub's shared egress IPs hard, so a
    # single daily attempt used to leave the site stale for days at a time.
    - cron: '0 3 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Never let the two daily runs race each other onto main.
concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  update-papers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Fails the job when arXiv is unreachable, instead of reporting a
      # green run that fetched nothing.
      - name: Fetch papers
        run: python _scripts/fetch_papers.py

      - name: Commit and push if changed
        run: |
          git config user.name 'GitHub Action'
          git config user.email 'action@github.com'
          git add _data
          git diff --cached --quiet && { echo 'No changes.'; exit 0; }
          git commit -m 'Update arXiv papers'
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
